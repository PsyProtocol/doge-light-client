[package]
name = "psy-doge-bridge-helper"
version = "0.1.0"
edition = "2021"

[features]
default = ["sha2", "serialize_bytemuck", "serialize_speedy", "serialize_borsh"]

serialize_borsh = ["dep:borsh"]
serialize_serde = ["dep:serde", "dep:serde_with", "doge-light-client/serialize_serde"]
solprogram = ["dep:solana-program", "doge-light-client/solprogram"]
sha2 = ["doge-light-client/sha2"]
std = ["doge-light-client/std"]

serialize_speedy = ["dep:speedy", "doge-light-client/serialize_speedy"]
serialize_bytemuck = ["dep:bytemuck", "doge-light-client/serialize_bytemuck"]

[dependencies]
borsh = { workspace = true, optional = true }
doge-light-client = { path = "../doge-light-client", default-features = false, features = ["serialize_borsh", "serialize_bytemuck"] }
psy-doge-macros = { path = "../psy-doge-macros" }

thiserror = { workspace = true }
num-derive = { workspace = true }
num-traits = { workspace = true }
anyhow = { workspace = true }
bytemuck = { workspace = true, optional = true }
speedy = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_with = { workspace = true, optional = true }
solana-program ={ workspace = true, optional = true }
zerocopy = { workspace = true }
zerocopy-derive = { workspace = true }


[dev-dependencies]
rand = { workspace = true }
rand_core = { workspace = true }
hex = { workspace = true }
hex-literal = { workspace = true }
doge-light-client = { path = "../doge-light-client", default-features = false, features = ["serialize_borsh", "sha2", "std"] }
bs58 = { workspace = true }
borsh = { workspace = true }
