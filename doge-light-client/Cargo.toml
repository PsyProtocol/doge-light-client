[package]
name = "doge-light-client"
version = "0.1.0"
edition = "2021"

[features]
default = ["serialize_borsh", "sha2", "serialize_bytemuck"]
serialize_borsh = ["dep:borsh", "zerocopy/borsh"]
serialize_serde = ["dep:serde", "dep:serde_with", "zerocopy/serde"]
bitcoin = ["dep:bitcoin", "serialize_serde"]
solprogram = ["dep:solana-program"]
sha2 = ["dep:sha2"]
std = []

serialize_speedy = ["dep:speedy"]
serialize_bytemuck = ["dep:bytemuck"]

[dependencies]
serde = { workspace = true, optional = true }
serde_with = { workspace = true, optional = true }
bs58 = { workspace = true }
ripemd = { workspace = true }
scrypt = { workspace = true }
borsh = { workspace = true, optional = true }
thiserror = { workspace = true }
num-derive = { workspace = true }
num-traits = { workspace = true }
zerocopy = { git = "https://github.com/cf/zerocopy-borsh-serde", branch = "borsh-serde-v0.8.23", features = ["borsh"] }
zerocopy-derive = { git = "https://github.com/cf/zerocopy-borsh-serde", branch = "borsh-serde-v0.8.23" }

bitcoin = { workspace = true, optional = true }
anyhow = { workspace = true }
bytemuck = { workspace = true, optional = true }
speedy = { workspace = true, optional = true }
solana-program = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }

[dev-dependencies]
hex = { workspace = true }
hex-literal = { workspace = true }
bitcoin = { workspace = true }
rand = { workspace = true }
rand_core = { workspace = true }
