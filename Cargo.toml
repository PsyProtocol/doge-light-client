[workspace]
resolver = "2"
members = [ 
    "psy-doge-data-link",
    "doge-light-client",
    "psy-doge-bridge-helper",
    "psy-doge-macros",
    "doge-bridge-block-state"

]

[workspace.dependencies]

serde = { version = "^1.0", features = ["derive"]}
serde_with = { version = "^3.0"}
bs58 = { version = "0.5.1", default-features = false, features = ["check", "alloc"] }
ripemd = "0.1.3"
scrypt = { version = "0.11.0", default-features = false, features = [] }
borsh = { version = "0.10.4"}
thiserror = "^1.0"
num-derive = "^0.3"
num-traits = "^0.2"
zerocopy = { git = "https://github.com/cf/zerocopy-borsh-serde", branch = "borsh-serde-v0.8.23", features = ["borsh"] }
zerocopy-derive = { git = "https://github.com/cf/zerocopy-borsh-serde", branch = "borsh-serde-v0.8.23" }
paste = "1.0.15"
syn = { version = "2.0", features = ["full"] }
proc-macro2 = { version = "1.0", features = ["span-locations"] }
quote = "1.0"

bitcoin = { git = "https://github.com/QEDProtocol/rust-dogecoin", rev = "9b52ed2ddc18c2062c741b7df7a6e70aabde3bb8", features = [ "serde" ] }
anyhow = { version = "1.0.75", default-features = false, features = [] }

solana-program = { version = "~2.1"}
sha2 = { version = "0.10.8"}

bytemuck = { version = "1.24.0", features = ["derive", "min_const_generics", "extern_crate_alloc"] }

hex = "0.4.3"
hex-literal = "0.4.1"
rand = "0.8"
rand_core = "0.6.0"
speedy = "0.8.7"

embedded-io = "0.7.0"
embedded-io-async = "0.7.0"

async-trait = { version = "0.1.88" }

doge-light-client = { path = "./doge-light-client" }
